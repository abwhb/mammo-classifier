[project]
name = "mammo-ml"
version = "0.1.0"
description = "Training and evaluation code for the mammogram classifier"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "pydicom>=3.0",
    "pillow>=11.0",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "requests>=2.32",
    "huggingface-hub>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "jupyterlab>=4.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
